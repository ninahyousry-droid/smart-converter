<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer decorative glow circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Central Document / File Shapes -->
  <g filter="url(#shadow)">
    <!-- Back document -->
    <rect x="140" y="110" width="180" height="230" rx="20" fill="#ffffff" fill-opacity="0.35" transform="rotate(-8 230 225)"/>
    <!-- Front document -->
    <rect x="180" y="140" width="190" height="250" rx="22" fill="#ffffff"/>
    
    <!-- Document Lines -->
    <rect x="210" y="185" width="90" height="12" rx="6" fill="#3b82f6"/>
    <rect x="210" y="215" width="130" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="210" y="235" width="115" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="210" y="255" width="80" height="8" rx="4" fill="#cbd5e1"/>
    
    <!-- Conversion Circular Arrows Badge -->
    <circle cx="330" cy="340" r="64" fill="url(#glow)"/>
    <circle cx="330" cy="340" r="54" fill="#0f172a"/>
    
    <!-- Loop Arrows Path -->
    <path d="M305 330 A 26 26 0 0 1 355 330 M355 330 L345 320 M355 330 L345 340" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M355 350 A 26 26 0 0 1 305 350 M305 350 L315 340 M305 350 L315 360" fill="none" stroke="#c084fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Mini badges representing 40 tools & local PWA badge -->
  <rect x="76" y="410" width="160" height="38" rx="19" fill="#10b981"/>
  <text x="156" y="434" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">100% محلي أوفلاين</text>
  
  <rect x="260" y="410" width="176" height="38" rx="19" fill="#f59e0b"/>
  <text x="348" y="434" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">40 أداة مجانية</text>
</svg>
